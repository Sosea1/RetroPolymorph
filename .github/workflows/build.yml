name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download official RFTools 7.73 for contract checks
        run: curl --fail --location --retry 3 https://mediafilez.forgecdn.net/files/2861/573/rftools-1.12-7.73.jar --output "$RUNNER_TEMP/rftools-1.12-7.73.jar"
      - name: Build, test and check real RFTools targets
        run: bash gradlew test build verifyCompatContracts "-PcompatJars=$RUNNER_TEMP/rftools-1.12-7.73.jar" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RetroPolymorph
          path: build/libs/*.jar
